name: 缺陷报告
description: 报告一个缺陷或不符合预期的行为
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么，出现在哪个界面或脚本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      value: |
        1. 打开
        2. 点击
        3. 看到
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: Windows 版本、是否安装 WebView2、启动方式
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - 阻断（无法启动）
        - 严重（主流程受影响）
        - 一般（局部功能异常）
        - 轻微（样式/文案）
    validations:
      required: true
